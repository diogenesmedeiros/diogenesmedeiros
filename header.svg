<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Backend Developer | Cyber Security">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace; }
      .prompt { fill: #3FB950; font-size: 22px; }
      .cmd    { fill: #C9D1D9; font-size: 22px; }
      .role   { fill: #58A6FF; font-size: 30px; font-weight: 700; letter-spacing: 1px; }
      .sub    { fill: #8B949E; font-size: 20px; }
      .tab    { fill: #6E7681; font-size: 16px; }

      @keyframes reveal { from { width: 0; } to { width: 1140px; } }
      @keyframes blink  { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }
      @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }

      #w1 { animation: reveal 1.1s steps(28) 0.25s both; }
      #w2 { animation: reveal 1.4s steps(36) 1.55s both; }
      #w3 { animation: reveal 1.0s steps(26) 3.15s both; }
      #w4 { animation: reveal 1.5s steps(45) 4.35s both; }
      #cursor { animation: fade 0.1s 6.0s both, blink 1.1s step-end 6.0s infinite; }
      .scan { animation: fade 1.2s ease-in both; }
    </style>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#1f6feb" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>

    <clipPath id="c1" clipPathUnits="userSpaceOnUse"><rect id="w1" x="52" y="92"  height="34" width="0"/></clipPath>
    <clipPath id="c2" clipPathUnits="userSpaceOnUse"><rect id="w2" x="52" y="130" height="44" width="0"/></clipPath>
    <clipPath id="c3" clipPathUnits="userSpaceOnUse"><rect id="w3" x="52" y="196" height="34" width="0"/></clipPath>
    <clipPath id="c4" clipPathUnits="userSpaceOnUse"><rect id="w4" x="52" y="234" height="34" width="0"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="14" fill="#0D1117"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- title bar -->
  <path d="M14 0 H1186 A14 14 0 0 1 1200 14 V46 H0 V14 A14 14 0 0 1 14 0 Z" fill="#161B22"/>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#30363D" stroke-width="1"/>
  <circle cx="28" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="23" r="6" fill="#27C93F"/>
  <text class="mono tab" x="600" y="29" text-anchor="middle">diogenes@debian:~/profile</text>

  <!-- body -->
  <g clip-path="url(#c1)">
    <text class="mono" x="52" y="118"><tspan class="prompt">$</tspan><tspan class="cmd" dx="12">whoami --role</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text class="mono role" x="52" y="164">Backend Developer <tspan fill="#484F58">|</tspan> Cyber Security</text>
  </g>
  <g clip-path="url(#c3)">
    <text class="mono" x="52" y="222"><tspan class="prompt">$</tspan><tspan class="cmd" dx="12">cat focus.txt</tspan></text>
  </g>
  <g clip-path="url(#c4)">
    <text class="mono sub" x="52" y="260">APIs · Microsserviços · Pentest · Red Team</text>
  </g>

  <g id="cursor" opacity="0">
    <text class="mono" x="52" y="300"><tspan class="prompt">$</tspan></text>
    <rect x="76" y="283" width="12" height="22" fill="#58A6FF"/>
  </g>
</svg>
